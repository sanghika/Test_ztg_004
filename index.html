<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZiptoGit - Push ZIP Archives Directly to GitHub</title>
    
    <!-- SEO Metadata -->
    <meta name="description" content="Upload a ZIP archive or, on desktop, a project folder. Push the files to GitHub from your browser without installing Git." />
    <meta name="keywords" content="GitHub, ZIP upload, Git push online, AI Studio export, ZiptoGit, Zip Sync" />
    <meta name="author" content="Dipesh Nalawade" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://ziptogit.in/" />
    
    <!-- Favicon: a real vector SVG (about 1 KB; it also switches to light ink in a
         dark browser theme) for current browsers, a 3-size ICO (16/32/48) for
         browsers and crawlers that do not use SVG icons, and a small PNG for the iOS
         home screen. Keep the SVG free of embedded bitmaps: it used to be a 512px
         PNG inside an SVG wrapper (172 KB). -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#eef1f6" />
    <!-- Theme, applied before first paint so there is no light flash. Same rule
         as getInitialTheme() in src/App.tsx: stored choice, else the OS setting. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("ziptogit-theme");
          var dark = t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", dark ? "#0b0f17" : "#eef1f6");
        } catch (e) {}
      })();
    </script>

    <!-- Returning visitor on "/": the server sets a readable has_session=1 cookie
         next to the HttpOnly session cookie. If it is present, (1) mark <html> so
         index.css hides the prerendered signed-out hero (a signed-in person must
         not see the upload landing page flash up) and shows a spinner in its
         place, (2) preconnect to the avatar host, and (3) start GET /api/bootstrap (user + first page of repos) right
         now, so it runs in parallel with the JS download instead of after it.
         fetchBootstrap() in src/lib/github.ts takes the result from
         window.__ZTG_BOOT__. Without the flag there is nothing to wait
         for: the hero is already in the HTML and no request is made at all.
         Only on "/", the only page that shows account state. -->
    <script>
      (function () {
        try {
          if (location.pathname !== "/") return;
          if (!/(?:^|;\s*)has_session=1(?:;|$)/.test(document.cookie)) return;
          document.documentElement.classList.add("session-pending");
          // The signed-in screen shows the GitHub avatar from this host (see
          // src/lib/avatar.ts). Open the connection now, alongside /api/bootstrap,
          // so it is ready when the image is requested. Only returning visitors
          // get this: a signed-out visitor never loads an avatar, so for them a
          // preconnect would be a wasted connection. No crossorigin: <img> is a
          // no-cors request and would not reuse a crossorigin connection.
          var pc = document.createElement("link");
          pc.rel = "preconnect";
          pc.href = "https://avatars.githubusercontent.com";
          document.head.appendChild(pc);
          window.__ZTG_BOOT__ = fetch("/api/bootstrap", { credentials: "include" }).then(function (res) {
            return res.json().then(
              function (body) { return { ok: res.ok, status: res.status, body: body }; },
              function () { return { ok: res.ok, status: res.status, body: null }; }
            );
          });
        } catch (e) {}
      })();
    </script>

    <!-- One self-hosted Latin subset covers the UI's 400–600 weights.
         crossorigin is required for font preloads, including same-origin URLs. -->
    <link rel="preload" href="/fonts/inter-4.0-latin-variable-400-600.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Open Graph Tags -->
    <meta property="og:title" content="ZiptoGit - Fast ZIP to GitHub Pushing" />
    <meta property="og:description" content="Upload a ZIP archive or, on desktop, a project folder. Push the files to GitHub from your browser without installing Git." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ziptogit.in/" />
    <meta property="og:image" content="https://ziptogit.in/social.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    
    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ZiptoGit - Fast ZIP to GitHub Pushing" />
    <meta name="twitter:description" content="Upload a ZIP archive or, on desktop, a project folder. Push the files to GitHub from your browser without installing Git." />
    <meta name="twitter:image" content="https://ziptogit.in/social.jpg" />
    
    <!-- Analytics is not loaded from this file. src/lib/analytics.ts adds Google
         Analytics after the page has loaded, and only when VITE_GA_MEASUREMENT_ID
         is set to a real GA4 ID at build time. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
